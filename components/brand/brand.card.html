<!-- @dsCard group="Components" viewport="700x300" name="Brand · Logo, Pattern, ArchFrame" -->
<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:24px;background:var(--bg-page);font-family:var(--font-body);color:var(--fg-1)}.m{font-family:var(--font-mono);font-size:12px;color:var(--fg-label)}</style></head><body><div id="root"></div>
<script type="text/babel">
const NS = (() => { for (const k of Object.keys(window)) { try { const v = window[k]; if (v && typeof v === 'object' && v.Button && v.Logo) return v; } catch (e) {} } return {}; })();
if (!NS.Button) document.getElementById('root').innerHTML = '<p class="m">Bundle do design system ainda não gerado.</p>';
const { Logo, Pattern, ArchFrame } = NS;
if (NS.Button) ReactDOM.createRoot(document.getElementById('root')).render(<div style={{display:'grid',gridTemplateColumns:'1fr 1.4fr 160px',gap:16,height:250}}>
  <div style={{background:'var(--bg-surface)',display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:16}}><Logo width={130} basePath="../../logo/svg/" /><span className="m">Logo · vertical/cores</span></div>
  <Pattern tone="verde" style={{height:250}}><div style={{height:'100%',display:'flex',alignItems:'center',justifyContent:'center'}}><div style={{background:'var(--bg-brand)',padding:20}}><Logo version="roseta" width={70} basePath="../../logo/svg/" /></div></div></Pattern>
  <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:10,justifyContent:'flex-end'}}><ArchFrame width={150} ratio={1.35} border={8} frameColor="var(--bg-brand)"><div style={{height:'100%',display:'flex',alignItems:'center',justifyContent:'center',fontSize:12,color:'var(--fg-3)'}}>foto</div></ArchFrame><span className="m">ArchFrame</span></div>
</div>);
</script></body></html>
