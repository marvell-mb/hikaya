<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:24px;background:var(--bg-page);color:var(--fg-1);font-family:var(--font-body);box-sizing:border-box}*{box-sizing:border-box}.m{font-family:var(--font-mono);font-size:12px;color:var(--fg-label);letter-spacing:.04em}.row{display:flex;gap:16px}.col{display:flex;flex-direction:column;gap:6px}.ph{display:flex;flex-direction:column;gap:8px;flex:1}.ph p{margin:0;font-size:13px;line-height:1.4;color:var(--fg-2)}</style></head><body><div class="row" style="gap:14px"><div class="ph"><div style="height:170px;background:#FFFFFF;box-shadow:var(--shadow-hairline);display:flex;align-items:center;justify-content:center;color:var(--fg-3);font-size:13px">fundo branco puro</div><strong style="font-size:14px">1 · Principal</strong><p>Produto inteiro, centralizado, ~85% do quadro. Sem logo, texto ou selo.</p></div><div class="ph"><div style="height:170px;background:var(--bg-surface);display:flex;align-items:flex-end;justify-content:center;padding-top:14px"><div style="width:62%;height:100%;border-radius:999px 999px 0 0;background:var(--creme-400);display:flex;align-items:center;justify-content:center;color:var(--fg-3);font-size:13px">janela</div></div><strong style="font-size:14px">2 · Secundária</strong><p>Fundo creme, moldura em janela, detalhe de tecido e bordado.</p></div><div class="ph"><div style="height:170px;background:var(--bg-brand-2);display:flex;align-items:center;justify-content:center;color:var(--creme-400);font-size:13px">luz quente, movimento</div><strong style="font-size:14px">3 · Lifestyle</strong><p>Peça em uso, girando. Luz natural quente, pele real, sem filtro frio.</p></div></div></body></html>
